<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">ILYA - Creative Developer &amp; Graphic Designer</title>
  <desc id="desc">Graphite and silver geometric GitHub profile banner</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#08090c"/>
      <stop offset=".55" stop-color="#14151b"/>
      <stop offset="1" stop-color="#08090d"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".45" stop-color="#c8ccd8"/>
      <stop offset="1" stop-color="#767c8c"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#c6c9d7" stop-opacity=".65"/>
      <stop offset="1" stop-color="#666c86" stop-opacity=".04"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#8388b4" stop-opacity=".24"/>
      <stop offset="1" stop-color="#8388b4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#b5bddb" stroke-opacity=".075" stroke-width=".8"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <rect width="1200" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="18" fill="url(#grid)"/>
  <path d="M0 0L410 0L280 340L0 340Z" fill="#ffffff" opacity=".018"/>
  <path d="M470 0L690 0L565 340L350 340Z" fill="#ffffff" opacity=".012"/>
  <circle cx="962" cy="176" r="230" fill="url(#glow)"/>
  <g fill="none" stroke="url(#arc)">
    <circle cx="974" cy="170" r="142" stroke-width="1.6"/>
    <circle cx="974" cy="170" r="114" stroke-width="1"/>
    <circle cx="974" cy="170" r="83" stroke-width="1.3"/>
    <circle cx="974" cy="170" r="52" stroke-width=".9"/>
    <path d="M754 170H1197M974 -28V340" stroke="#c0c4d1" stroke-opacity=".13"/>
  </g>
  <g transform="translate(974 170) rotate(-24)" fill="none" stroke="#aeb5d0" stroke-width="3" stroke-linecap="round" opacity=".92">
    <path d="M-36-25L-64 0L-36 25"/>
    <path d="M36-25L64 0L36 25"/>
    <path d="M15-46L-15 46" stroke="#d7dbec" stroke-width="2"/>
  </g>
  <circle cx="835" cy="106" r="4" fill="#e0e3f3"/>
  <circle cx="835" cy="106" r="10" fill="#e0e3f3" opacity=".2" filter="url(#softGlow)"/>
  <circle cx="1075" cy="276" r="3.5" fill="#bfc5e4"/>
  <g font-family="Segoe UI, DejaVu Sans, Arial, sans-serif">
    <rect x="64" y="51" width="7" height="7" rx="1.5" fill="#c4c6d3"/>
    <text x="84" y="59" fill="#a8abb8" font-size="15" font-weight="600" letter-spacing="3">PORTFOLIO / 2026</text>
    <text x="64" y="161" fill="url(#silver)" font-size="98" font-weight="750" letter-spacing="5">ILYA</text>
    <rect x="66" y="181" width="62" height="3" rx="1.5" fill="#c0c4d9"/>
    <text x="66" y="225" fill="#f2f2f6" font-size="24" font-weight="600" letter-spacing="1.5">GRAPHIC DESIGNER  /  DEVELOPER</text>
    <text x="66" y="266" fill="#979ba9" font-size="18" letter-spacing=".7">Designing identities. Engineering experiences.</text>
    <text x="66" y="311" fill="#626773" font-size="12.5" letter-spacing="2.2">VISUALS  ·  AUTOMATION  ·  DISCORD &amp; TELEGRAM BOTS</text>
  </g>
  <rect x="1" y="1" width="1198" height="338" rx="17" stroke="#a6aec6" stroke-opacity=".2" stroke-width="1.5" fill="none"/>
</svg>
